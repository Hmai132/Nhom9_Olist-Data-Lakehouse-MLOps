name: Olist Data Lakehouse CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-lakehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas scikit-learn

      - name: Verify 9 Raw Olist CSV Datasets
        run: |
          python -c "
          from pathlib import Path
          raw = list(Path('data/raw').glob('*.csv'))
          print(f'Found {len(raw)} raw CSV files')
          assert len(raw) >= 9, 'Missing raw CSV files'
          "

      - name: Verify Gold Lakehouse Database & ML Artifacts
        run: |
          python -c "
          import duckdb
          from pathlib import Path
          db = Path('data/warehouse/dashboard.duckdb')
          assert db.exists(), 'Missing dashboard.duckdb'
          con = duckdb.connect(str(db), read_only=True)
          tables = con.execute(\"SELECT table_name FROM information_schema.tables WHERE table_schema='gold'\").fetchall()
          print(f'Validated Gold tables: {[t[0] for t in tables]}')
          assert len(tables) >= 5, 'Missing Gold tables'
          con.close()
          assert Path('data/ml/models/dashboard_joint_predictions.csv').exists(), 'Missing predictions CSV'
          assert Path('data/ml/models/dashboard_joint_predictions_metadata.json').exists(), 'Missing metadata JSON'
          "

      - name: Verify Dashboard Web Server Integrity
        run: |
          python -c "
          import importlib
          server = importlib.import_module('dashboard.server')
          print('Successfully validated dashboard.server module')
          "
